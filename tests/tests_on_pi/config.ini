; AISENTINEL Pi behavior test configuration
; Paths inside this file are resolved relative to the repository root.

[models]
pose = models/yolo_pose_model.hef
hand = models/hand-latest.hef
object = models/object-updated.hef

[inference]
pose_confidence = 0.70
object_confidence = 0.25

[runtime]
port = 8080

[web_dashboard]
username = admin
password = admin123
secret_key = change-this-secret-key
session_ttl_minutes = 480

[video_source]
default_video =
default_setup_profile =
auto_use_saved_setup = true

[webcam_source]
camera_index = 0
camera_name = pi_test_webcam
capture_width = 1280
capture_height = 720
capture_fps = 30.0
warmup_frames = 15
default_setup_profile = tests/tests_on_pi/setup_profiles/front_webcam_all_behavior_setup.json
auto_use_saved_setup = true

[outputs]
evidence_root = tests/tests_on_pi/evidence_combined
setup_profile_dir = tests/tests_on_pi/setup_profiles

[tracking]
iou_threshold = 0.30
max_lost = 60

[head_behavior]
head_tilt_angle_deg = 30.0
head_turn_ratio = 0.18
shoulder_turn_angle_deg = 20.0
sustained_sec = 2.5
event_cooldown_sec = 10.0
keypoint_confidence = 0.30

[passing_papers]
event_cooldown_sec = 10.0
keypoint_confidence = 0.30
row_tolerance_px = 80
reference_bbox_height = 300.0
wrist_proximity_px = 160
min_interaction_sec = 0.03

[hands_under_table]
hand_confidence = 0.30
person_confidence = 0.50
hands_missing_sustain_sec = 3.0
event_cooldown_sec = 10.0
min_visible_hands = 2
hand_assoc_margin_px = 60
smooth_window_frames = 12
smooth_missing_ratio = 0.60
student_absent_reset_sec = 2.0
table_edge_near_px = 35
edge_disappear_arm_sec = 0.75

[object_detection]
person_confidence = 0.50
phone_confidence = 0.25
cheat_sheet_confidence = 0.30
event_cooldown_sec = 10.0
assoc_iou_thresh = 0.05

[evidence]
pre_event_frames = 10
post_event_frames = 10

[spam_suppression]
duplicate_suppression_sec = 60.0
clear_required_sec = 3.0
