; AISENTINEL front-node video runtime configuration
; Paths inside this file are resolved relative to the repository root.

[models]
pose = models/yolov8s_pose.hef
hand = models/sentinel-yolo11n-min.hef
object = models/yolov11n-sentinel-new/sentinel-yolov11n_new.hef

[inference]
pose_confidence = 0.50
object_confidence = 0.25

[runtime]
port = 8080

[web_dashboard]
username = admin
password = admin123
secret_key = change-this-secret-key
session_ttl_minutes = 480

[video_source]
default_video =
default_setup_profile =
auto_use_saved_setup = true

[outputs]
evidence_root = runtime/front_node_pi/data/evidence_combined
setup_profile_dir = runtime/front_node_pi/data/setup_profiles

[tracking]
iou_threshold = 0.30
max_lost = 60

[head_behavior]
head_tilt_angle_deg = 30.0
head_turn_ratio = 0.18
shoulder_turn_angle_deg = 20.0
sustained_sec = 2.5
event_cooldown_sec = 10.0
keypoint_confidence = 0.30

[passing_papers]
event_cooldown_sec = 10.0
keypoint_confidence = 0.30
row_tolerance_px = 80
reference_bbox_height = 300.0
wrist_proximity_px = 160
min_interaction_sec = 0.03

[hands_under_table]
hand_confidence = 0.30
person_confidence = 0.50
hands_missing_sustain_sec = 3.0
event_cooldown_sec = 10.0
min_visible_hands = 2
hand_assoc_margin_px = 60
smooth_window_frames = 12
smooth_missing_ratio = 0.60
student_absent_reset_sec = 2.0
table_edge_near_px = 35
edge_disappear_arm_sec = 0.75

[object_detection]
person_confidence = 0.50
phone_confidence = 0.40
cheat_sheet_confidence = 0.30
event_cooldown_sec = 10.0
assoc_iou_thresh = 0.05

[evidence]
pre_event_frames = 10
post_event_frames = 10
