[agent]
node_id = mid
display_name = Mid Node
camera_label = Mid Camera
profile = mid
host = 0.0.0.0
port = 8092
api_key = mid-node-dev-key
central_base_url = http://127.0.0.1:8090
registration_interval_sec = 10
heartbeat_interval_sec = 3
sync_interval_sec = 2
http_timeout_sec = 5
local_db_path = runtime/central_dashboard/data/node_mid/queue.sqlite3

[capture]
source_mode = video
camera_index = 0
; Leave blank to use [video_source] default_video from node_mid_runtime.ini.
video_path =

[preview]
width = 960
fps = 10
jpeg_quality = 72

[detector]
mode = front_runtime
runtime_config_path = runtime/central_dashboard/node_mid_runtime.ini
motion_threshold = 24.0
motion_min_area_ratio = 0.012
motion_cooldown_sec = 8.0
annotated_banner_ttl_sec = 4.0

[evidence]
root = runtime/central_dashboard/data/node_mid/evidence
pre_event_frames = 8
post_event_frames = 8

