[agent]
node_id = front
display_name = Front Node
camera_label = Front Camera
profile = front
; Local bind address for this node agent on the Pi.
; Keep 0.0.0.0 for most installs. Do not put the laptop IP here.
host = 0.0.0.0
; Local port exposed by this node agent.
port = 8091
api_key = front-node-dev-key
; Remote address of the machine running the central dashboard service.
; Use 127.0.0.1 only when both processes run on the same machine.
central_base_url = http://127.0.0.1:8090
registration_interval_sec = 10
heartbeat_interval_sec = 3
sync_interval_sec = 2
http_timeout_sec = 5
local_db_path = runtime/central_dashboard/data/node_front/queue.sqlite3
clear_sync_backlog_on_session_start = true

[capture]
source_mode = webcam
camera_index = 0
video_path =

[preview]
width = 960
fps = 10
jpeg_quality = 72

[detector]
mode = front_runtime
runtime_config_path = runtime/central_dashboard/node_front_runtime.ini
motion_threshold = 24.0
motion_min_area_ratio = 0.012
motion_cooldown_sec = 8.0
annotated_banner_ttl_sec = 4.0

[evidence]
root = runtime/central_dashboard/data/node_front/evidence
pre_event_frames = 8
post_event_frames = 8

[spam_suppression]
duplicate_suppression_sec = 60.0
clear_required_sec = 3.0
